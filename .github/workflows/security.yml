name: Security and regression checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          # Ephemeral CI-only credentials; never production or repository secrets.
          MARIADB_ROOT_PASSWORD: ci-root-ephemeral
          MARIADB_DATABASE: publishing_erp_test
          MARIADB_USER: erp_test
          MARIADB_PASSWORD: ci-test-ephemeral
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      TEST_DB_URL: jdbc:mariadb://127.0.0.1:3307/publishing_erp_test
      TEST_DB_USERNAME: erp_test
      TEST_DB_PASSWORD: ci-test-ephemeral
      DB_PASSWORD: ci-unused-placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Login, session, authorization, JSP and DB regression tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Scan packaged Java dependencies for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: target/
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          skip-dirs: target/test-classes,target/surefire-reports
      - name: Scan tracked source for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
          format: table
          skip-dirs: .git,target
