# Local data is persistent; demo seeds are opt-in.
logging:
  level:
    com.portfolio.erp: INFO

# 로컬 학습 중 JSP 저장 후 새로고침으로 변경을 확인한다.
server:
  tomcat:
    resource:
      allow-caching: false
  servlet:
    session:
      cookie:
        secure: false # Loopback HTTP development only; production uses Secure.
    jsp:
      init-parameters:
        development: true
        modificationTestInterval: 0
        recompileOnFail: true
