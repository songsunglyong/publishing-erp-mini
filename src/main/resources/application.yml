server:
  address: 127.0.0.1
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true
spring:
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3307/publishing_erp}
    username: ${DB_USERNAME:erp_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
server.error.include-message: never
