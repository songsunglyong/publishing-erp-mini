server:
  address: 127.0.0.1
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: true
        same-site: lax
    encoding:
      charset: UTF-8
      force: true
spring:
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3307/publishing_erp}
    username: ${DB_USERNAME:erp_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
server.error.include-message: never
server.error.include-stacktrace: never
server.error.include-binding-errors: never
server.error.include-exception: false
spring.messages.encoding: UTF-8
spring.messages.fallback-to-system-locale: false
spring.mvc.log-request-details: false
logging.level.org.springframework.jdbc: OFF
logging.level.org.mybatis: OFF
logging.level.org.mariadb.jdbc: OFF

security.bootstrap.enabled: ${ERP_BOOTSTRAP_ENABLED:false}
security.bootstrap.username: ${ERP_BOOTSTRAP_USERNAME:admin}
security.bootstrap.password: ${ERP_BOOTSTRAP_PASSWORD:}
logging.level.org.springframework.security: WARN
