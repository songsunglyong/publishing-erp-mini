spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mariadb://127.0.0.1:3307/publishing_erp_test}
    username: ${TEST_DB_USERNAME:erp_test}
    password: ${TEST_DB_PASSWORD}
